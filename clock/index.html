<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Wombats World Clock</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.24.0/moment.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.23/moment-timezone-with-data.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script type="text/javascript"
        src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.11.4/jquery-ui.min.js"></script>
    <script type="text/javascript"
        src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui-touch-punch/0.2.3/jquery.ui.touch-punch.min.js"></script>
</head>

<body>
    <div id='container'>
        <div class='row'>
            <div class='area'>Japan</div>
            <div class='time' id='jst'></div>
            <img class='icon' id='jst-icon' src='womby_skate.png' />
        </div>
        <div class='row'>
            <div class='area'>Seattle</div>
            <div class='time' id='pt'></div>
            <img class='icon' id='pt-icon' src='womby_skate.png' />
        </div>
        <div class='row'>
            <div class='area'>New York</div>
            <div class='time' id='ny'></div>
            <img class='icon' id='ny-icon' src='womby_skate.png' />
        </div>
        <div id="slider"></div>
    </div>
</body>
<script>
    var fmt = "MM-DD HH:mm";

    var setTime = function (t) {
        setTimeLocal(t, 'jst', 'jst-icon', 'Japan');
        setTimeLocal(t, 'pt', 'pt-icon', 'America/Los_Angeles');
        setTimeLocal(t, 'ny', 'ny-icon', 'America/New_York');
    }

    var setTimeLocal = function(t, timeId, iconId, tz) {
        t = t.tz(tz);
        document.getElementById(timeId).innerHTML = t.format(fmt);

        var img = document.getElementById(iconId);

        var h = t.hours();
        if (h < 7) {
            img.src = 'womby_sleep2.png';
        } else if (h < 17) {
            img.src = 'womby_skate.png';            
        } else {
            img.src = 'womby_bath.png';
        }
    }

    window.onload = function () {
        var t = moment();
        setTime(t);

        $("#slider").slider({
            value: 0,
            min: 0,
            max: 2400,
            step: 30,
            slide: function (event, ui) {
                var t = moment();
                var mod = 60 - (t.minutes() % 60);
                t.add(mod + ui.value, 'minutes');
                setTime(t);
            }
        });
    }
</script>

</html>
